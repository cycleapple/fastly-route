[package]
name = "fastly-route"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A minimal native desktop tool for discovering Fastly CDN routes"
license = "MIT"
repository = "https://github.com/cycleapple/fastly-route"

[dependencies]
anyhow = "1"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
ipnet = "2"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[features]
screenshot = ["eframe/__screenshot"]

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
